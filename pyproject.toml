[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envs-xmpp"
version = "1.5.0"
readme = "README.md"
description = "Shared runtime and deployment primitives for envs.net XMPP bots"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{name = "~creme", email = "creme@envs.net"}]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "mutmut>=3",
  "ruff>=0.6",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/envs-net/envs-xmpp"
Documentation = "https://github.com/envs-net/envs-xmpp/blob/main/docs/README.md"
Repository = "https://github.com/envs-net/envs-xmpp"
Issues = "https://github.com/envs-net/envs-xmpp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "BLE"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.mutmut]
source_paths = [
  "src/envs_xmpp_ops/regression.py",
  "src/envs_xmpp_ops/testing.py",
]
also_copy = [
  "src/envs_xmpp_ops",
  "src/envs_xmpp_core",
]
pytest_add_cli_args_test_selection = [
  "tests/test_regression.py",
  "tests/test_quality.py",
]
pytest_add_cli_args = ["--no-cov", "-q", "-x", "--tb=short", "--disable-warnings"]
mutate_only_covered_lines = true

[tool.envs-xmpp.regression]
baseline = "tests/regression-baseline.json"
mutation-results = "mutants"
coverage-json = ".coverage-regression.json"
