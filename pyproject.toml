[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envs-xmpp-core"
version = "0.1.2"
readme = "README.md"
description = "Shared runtime primitives for envs.net XMPP bots"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{name = "~creme", email = "creme@envs.net"}]
dependencies = ["slixmpp>=1.8,<2"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "twine>=5",
]

[project.urls]
Repository = "https://github.com/envs-net/envs-xmpp-core"
Issues = "https://github.com/envs-net/envs-xmpp-core/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
